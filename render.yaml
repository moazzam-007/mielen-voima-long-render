services:
  - type: web
    name: mielen-voima-long-video-engine
    runtime: docker
    plan: free
    region: frankfurt # Low latency to Europe / Finland
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: CF_ACCOUNT_ID_1
        sync: false
      - key: CF_API_TOKEN_1
        sync: false
      - key: CF_ACCOUNT_ID_2
        sync: false
      - key: CF_API_TOKEN_2
        sync: false
      - key: CF_ACCOUNT_ID_3
        sync: false
      - key: CF_API_TOKEN_3
        sync: false
      - key: CF_THUMBNAIL_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_PRIMARY_MODEL
        sync: false
      - key: API_SECRET_KEY
        sync: false
